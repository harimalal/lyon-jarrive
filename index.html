<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lyon J'arrive — Gestion Emménagement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ballet-pink: #F2D5D5;
            --ballet-rose: #E8B4B8;
            --ballet-nude: #F5E6E0;
            --ballet-gold: #C9A96E;
            --ballet-burgundy: #8B3A4A;
            --ballet-cream: #FDF8F5;
            --ballet-charcoal: #2D2A2A;
            --ballet-taupe: #8B7D7B;
            --ballet-white: #FFFFFF;
            --ballet-shadow: rgba(139, 58, 74, 0.06);
            --ballet-border: #E8D5D0;
            --ballet-success: #7B9B6A;
            --ballet-danger: #C4727A;
            --p1-color: #8B3A4A;
            --p1-bg: rgba(139,58,74,0.08);
            --p2-color: #C9A96E;
            --p2-bg: rgba(201,169,110,0.08);
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(180deg, #FDF8F5 0%, #F5EDE8 100%);
            color: var(--ballet-charcoal);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        header {
            background: linear-gradient(135deg, #8B3A4A 0%, #6B2D3A 50%, #4A1F28 100%);
            color: white;
            padding: 1.2rem 1rem;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(201,169,110,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--ballet-gold), transparent);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .header-subtitle {
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 0.2rem;
            position: relative;
            z-index: 1;
        }

        /* ── CONTAINER ── */
        .container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 1rem;
            padding-bottom: 5rem;
        }

        /* ── DASHBOARD ── */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        .stat-box {
            background: var(--ballet-white);
            padding: 0.9rem;
            border-radius: 0.8rem;
            border: 1px solid var(--ballet-border);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .stat-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--ballet-rose), var(--ballet-gold));
            opacity: 0.6;
        }
        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--ballet-taupe);
            font-weight: 500;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
        }
        .stat-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--ballet-burgundy);
        }

        /* ── GLOBAL PROGRESS ── */
        .global-progress {
            background: var(--ballet-white);
            border-radius: 0.8rem;
            border: 1px solid var(--ballet-border);
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        .global-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.6rem;
        }
        .global-progress-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ballet-charcoal);
            letter-spacing: 0.3px;
        }
        .global-progress-pct {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ballet-burgundy);
        }
        .global-progress-bar {
            width: 100%; height: 6px;
            background: #F0E8E4;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.6rem;
        }
        .global-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ballet-rose), var(--ballet-gold), var(--ballet-burgundy));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .global-progress-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: var(--ballet-taupe);
            letter-spacing: 0.5px;
        }
        .global-progress-details span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .global-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .global-dot.items { background: var(--ballet-rose); }
        .global-dot.budget { background: var(--ballet-burgundy); }

        /* ── FILTERS ── */
        .filters {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.35rem 0.7rem;
            border: 1px solid var(--ballet-border);
            border-radius: 1rem;
            background: var(--ballet-white);
            font-size: 0.65rem;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--ballet-taupe);
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: var(--ballet-burgundy);
            color: white;
            border-color: var(--ballet-burgundy);
        }
        .filter-btn.p1-filter.active {
            background: var(--p1-color);
            border-color: var(--p1-color);
        }
        .filter-btn.p2-filter.active {
            background: var(--p2-color);
            border-color: var(--p2-color);
            color: white;
        }
        .filter-separator {
            width: 1px;
            background: var(--ballet-border);
            margin: 0 0.2rem;
            align-self: stretch;
        }

        /* ── CATEGORIES ── */
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .category-section {
            background: var(--ballet-white);
            border-radius: 0.8rem;
            overflow: hidden;
            border: 1px solid var(--ballet-border);
            transition: all 0.3s ease;
        }
        .category-section.hidden { display: none; }
        .category-header {
            padding: 0.8rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(180deg, #FDF8F5 0%, #FAF3F0 100%);
            border-bottom: 1px solid var(--ballet-border);
            user-select: none;
            transition: background 0.2s;
        }
        .category-header:active { background: #F5EDE8; }
        .category-toggle {
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            color: var(--ballet-burgundy);
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            opacity: 0.6;
        }
        .category-section.collapsed .category-toggle { transform: rotate(-90deg); }
        .category-title {
            flex: 1;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--ballet-charcoal);
            letter-spacing: 0.3px;
        }
        .category-stats-header {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            font-size: 0.7rem;
        }
        .stat-chip {
            background: rgba(201,169,110,0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-weight: 500;
            color: var(--ballet-gold);
            white-space: nowrap;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
        }
        .stat-chip.success {
            background: rgba(123,155,106,0.08);
            color: var(--ballet-success);
        }

        /* ── PROGRESS ── */
        .progress-section {
            padding: 0 1rem 0.8rem;
            display: none;
        }
        .category-section:not(.collapsed) .progress-section { display: block; }
        .progress-label {
            font-size: 0.6rem;
            color: var(--ballet-taupe);
            text-transform: uppercase;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }
        .progress-bar-container {
            width: 100%; height: 4px;
            background: #F0E8E4;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.6rem;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--ballet-rose), var(--ballet-gold));
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .budget-bar-container {
            width: 100%; height: 3px;
            background: #F0E8E4;
            border-radius: 2px;
            overflow: hidden;
        }
        .budget-spent {
            height: 100%;
            background: linear-gradient(90deg, var(--ballet-burgundy), #A04D5E);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .budget-label {
            font-size: 0.6rem;
            color: var(--ballet-taupe);
            margin-top: 0.2rem;
            display: flex;
            justify-content: space-between;
            letter-spacing: 0.5px;
        }

        /* ── ITEMS ── */
        .items-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .category-section:not(.collapsed) .items-container { max-height: 4000px; }
        .items-content {
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.6rem;
            background: #FDF8F5;
            border-radius: 0.5rem;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .item.completed {
            opacity: 0.5;
            background: #F8F4F0;
        }
        .item.hidden { display: none; }
        .item-checkbox {
            width: 18px; height: 18px;
            flex-shrink: 0;
            cursor: pointer;
            accent-color: var(--ballet-burgundy);
            margin: 0;
        }
        .item-info {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .item-name {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--ballet-charcoal);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .item-name.completed {
            text-decoration: line-through;
            color: var(--ballet-taupe);
        }
        .item-cost {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--ballet-gold);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .item-priority {
            font-size: 0.55rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 0.3rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .item-priority.p1 {
            background: var(--p1-bg);
            color: var(--p1-color);
        }
        .item-priority.p2 {
            background: var(--p2-bg);
            color: var(--p2-color);
        }
        .item-comment {
            font-size: 0.65rem;
            color: var(--ballet-taupe);
            font-style: italic;
            padding: 0.3rem 0.5rem;
            margin: 0.2rem 0 0 0;
            background: rgba(201,169,110,0.05);
            border-left: 2px solid var(--ballet-rose);
            border-radius: 0 0.3rem 0.3rem 0;
            word-break: break-word;
        }
        .item-actions {
            display: flex;
            gap: 0.2rem;
            flex-shrink: 0;
        }
        .item-btn {
            width: 28px; height: 28px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 0.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0.5;
        }
        .item-btn:hover, .item-btn:active { opacity: 1; }
        .item-btn-edit { color: var(--ballet-gold); }
        .item-btn-delete { color: var(--ballet-danger); }

        .empty-state {
            text-align: center;
            padding: 1.5rem 1rem;
            color: var(--ballet-taupe);
            font-size: 0.8rem;
            font-style: italic;
        }
        .empty-icon { font-size: 1.5rem; margin-bottom: 0.3rem; opacity: 0.5; }

        /* ── FAB ── */
        .fab {
            position: fixed;
            bottom: 1.5rem;
            right: 1.2rem;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ballet-burgundy), #6B2D3A);
            color: white;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(139,58,74,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 50;
        }
        .fab:active { transform: scale(0.92); }

        /* ── MODALS ── */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45,42,42,0.5);
            backdrop-filter: blur(2px);
            z-index: 1000;
            padding: 1rem;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal.active { display: flex; align-items: flex-end; }
        .modal-content {
            background: var(--ballet-white);
            border-radius: 1rem 1rem 0 0;
            padding: 1.5rem;
            width: 100%;
            animation: slideUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
            border-top: 2px solid var(--ballet-gold);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--ballet-burgundy);
        }
        .close-btn {
            background: none; border: none;
            font-size: 1.2rem; cursor: pointer;
            color: var(--ballet-taupe);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .close-btn:active { background: #F5EDE8; }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--ballet-taupe);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.3rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border: 1px solid var(--ballet-border);
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            background: #FDF8F5;
            color: var(--ballet-charcoal);
            transition: all 0.2s;
        }
        textarea { resize: vertical; min-height: 70px; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--ballet-gold);
            background: white;
            box-shadow: 0 0 0 3px rgba(201,169,110,0.1);
        }

        .btn {
            padding: 0.8rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--ballet-burgundy), #6B2D3A);
            color: white;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-secondary {
            background: #F5EDE8;
            color: var(--ballet-burgundy);
            border: 1px solid var(--ballet-border);
            margin-top: 0.5rem;
        }
        .button-group { display: flex; gap: 0.6rem; }
        .button-group .btn { flex: 1; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(253,248,245,0.85);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem; color: var(--ballet-burgundy);
            letter-spacing: 1px;
        }
        .loading-overlay.hidden { display: none; }

        @media (max-width: 480px) {
            .container { padding: 0.8rem; padding-bottom: 5rem; }
            header { padding: 1rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Lyon J'arrive</h1>
        <div class="header-subtitle">Gestion de l'emménagement · Internat Lyon</div>
    </header>

    <div class="container">
        <div class="dashboard">
            <div class="stat-box">
                <div class="stat-label">À acheter</div>
                <div class="stat-value" id="countTodo">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Achetés</div>
                <div class="stat-value" id="countDone">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Dépensé</div>
                <div class="stat-value" id="totalSpent">0 €</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Budget</div>
                <div class="stat-value" id="totalBudget">0 €</div>
            </div>
        </div>

        <!-- GLOBAL PROGRESS -->
        <div class="global-progress">
            <div class="global-progress-header">
                <span class="global-progress-title">Progression globale</span>
                <span class="global-progress-pct" id="globalPct">0%</span>
            </div>
            <div class="global-progress-bar">
                <div class="global-progress-fill" id="globalFill" style="width: 0%"></div>
            </div>
            <div class="global-progress-details">
                <span><span class="global-dot items"></span> <span id="globalItems">0/0 articles</span></span>
                <span><span class="global-dot budget"></span> <span id="globalBudget">0€ / 0€</span></span>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tout</button>
            <span class="filter-separator"></span>
            <button class="filter-btn p1-filter" data-filter="P1" onclick="setFilter('P1')">P1 · Sept/Oct</button>
            <button class="filter-btn p2-filter" data-filter="P2" onclick="setFilter('P2')">P2 · Nov/Déc</button>
            <span class="filter-separator"></span>
        </div>

        <div class="categories-list" id="categoriesContainer"></div>
    </div>

    <button class="fab" onclick="openModal('addModal')">+</button>

    <!-- ADD MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Ajouter un article</span>
                <button class="close-btn" onclick="closeModal('addModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Article</label>
                <input type="text" id="newItemName" placeholder="Oreiller, lampe...">
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="newItemCategory"></select>
            </div>
            <div class="form-group">
                <label>Nouvelle catégorie</label>
                <input type="text" id="newItemNewCategory" placeholder="🎓 Études">
            </div>
            <div class="form-group">
                <label>Coût estimé (€)</label>
                <input type="number" id="newItemCost" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Priorité</label>
                <select id="newItemPriority">
                    <option value="P1">P1 · Septembre/Octobre</option>
                    <option value="P2">P2 · Novembre/Décembre</option>
                </select>
            </div>
            <div class="form-group">
                <label>Commentaire</label>
                <textarea id="newItemComment" placeholder="Taille, promo, remarque..."></textarea>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="addNewItem()">Ajouter</button>
                <button class="btn btn-secondary" onclick="closeModal('addModal')">Annuler</button>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Modifier</span>
                <button class="close-btn" onclick="closeModal('editModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Article</label>
                <input type="text" id="editItemName">
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="editItemCategory"></select>
            </div>
            <div class="form-group">
                <label>Coût (€)</label>
                <input type="number" id="editItemCost" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label>Priorité</label>
                <select id="editItemPriority">
                    <option value="P1">P1 · Septembre/Octobre</option>
                    <option value="P2">P2 · Novembre/Décembre</option>
                </select>
            </div>
            <div class="form-group">
                <label>Commentaire</label>
                <textarea id="editItemComment"></textarea>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveEditItem()">Enregistrer</button>
                <button class="btn btn-secondary" onclick="closeModal('editModal')">Annuler</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay hidden" id="loadingOverlay">Chargement…</div>

    <script>
        const API = '/api';
        let appData = {};
        let expandedCategories = {};
        let editingItemId = null;
        let editingCategoryId = null;
        let currentFilter = 'all';

        function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

        async function apiFetch(path, options = {}) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: res.statusText }));
                throw new Error(err.error || 'API error');
            }
            const text = await res.text();
            return text ? JSON.parse(text) : null;
        }

        async function initApp() {
            showLoading();
            try {
                const categories = await apiFetch('/categories');
                if (!categories || categories.length === 0) {
                    await seedInitialData();
                    const fresh = await apiFetch('/categories');
                    buildAppData(fresh || []);
                } else {
                    buildAppData(categories);
                }
            } catch (err) {
                console.error('Init error:', err);
                alert('Erreur de connexion. Veuillez réessayer.');
            }
            hideLoading();
            buildCategoryFilters();
            render();
        }

        function buildAppData(categories) {
            appData = {};
            categories.forEach(cat => {
                expandedCategories[cat.id] = true;
                appData[cat.id] = {
                    name: cat.name,
                    budget: cat.budget,
                    items: (cat.items || []).map(item => ({
                        id: item.id,
                        name: item.name,
                        cost: item.cost,
                        comment: item.comment || '',
                        completed: item.completed === 1,
                        priority: item.priority || 'P1'
                    }))
                };
            });
            updateCategorySelect();
        }

        function buildCategoryFilters() {
            const filtersDiv = document.getElementById('filters');
            // Remove old category buttons (keep first 5: Tout, sep, P1, P2, sep)
            while (filtersDiv.children.length > 5) {
                filtersDiv.removeChild(filtersDiv.lastChild);
            }
            Object.entries(appData).forEach(([catId, catData]) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.filter = 'cat-' + catId;
                btn.textContent = catData.name.split(' ')[0];
                btn.onclick = () => setFilter('cat-' + catId);
                filtersDiv.appendChild(btn);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.filter-btn[data-filter="${filter}"]`)?.classList.add('active');
            render();
        }

        async function seedInitialData() {

                    { id: genId(), name: "Taies d'oreiller (×2)", cost: 5, comment: "", priority: "P1" },
                    { id: genId(), name: "Couette 140×200 ou 200×200", cost: 25, comment: "Vérifier taille du lit", priority: "P1" },
                    { id: genId(), name: "Housse de couette", cost: 12, comment: "", priority: "P1" },
                    { id: genId(), name: "Drap-housse", cost: 7, comment: "", priority: "P1" },
                    { id: genId(), name: "Protège-matelas", cost: 9, comment: "", priority: "P1" },
                    { id: genId(), name: "Plaid / jeté de lit", cost: 10, comment: "", priority: "P1" },
                    { id: genId(), name: "Coussins déco (×1)", cost: 6, comment: "", priority: "P2" }
                ]},
                { name: "🚿 Toilette & hygiène", budget: 80, items: [

                    { id: genId(), name: "Petites serviettes (×2)", cost: 6, comment: "", priority: "P1" },

                ]},
                { name: "🖥️ Bureau & fournitures", budget: 100, items: [
                    { id: genId(), name: "Lampe de bureau LED", cost: 15, comment: "", priority: "P1" },
                    { id: genId(), name: "Multiprise USB", cost: 12, comment: "", priority: "P1" },
                    { id: genId(), name: "Rallonge électrique", cost: 5, comment: "", priority: "P1" },

                ]},
                { name: "📦 Rangement & organisation", budget: 65, items: [

                { name: "🛋️ Confort & déco chambre", budget: 70, items: [

                    { id: genId(), name: "Rideau occultant", cost: 18, comment: "Si besoin, vérifier avec l'internat", priority: "P1" },
                    { id: genId(), name: "Guirlande LED déco", cost: 6, comment: "", priority: "P2" },
                    { id: genId(), name: "Photos / cadres / posters", cost: 8, comment: "", priority: "P2" },
                    { id: genId(), name: "Pâte adhésive", cost: 2, comment: "Pas de clous autorisés", priority: "P2" },
                    { id: genId(), name: "Mini plante", cost: 5, comment: "", priority: "P2" }
                ]},
                { name: "☕ Alimentation & électroménager", budget: 65, items: [
                    { id: genId(), name: "Bouilloire électrique", cost: 18, comment: "Vérifier si autorisée", priority: "P2" },
                    { id: genId(), name: "Tasse, verre, assiette, bol", cost: 8, comment: "", priority: "P1" },
                    { id: genId(), name: "Couverts", cost: 3, comment: "", priority: "P1" },
                    { id: genId(), name: "Boîte hermétique", cost: 4, comment: "", priority: "P2" },

                    { id: genId(), name: "Thé, café, en-cas", cost: 8, comment: "", priority: "P2" }
                ]},
                { name: "💊 Trousse de secours & pharmacie", budget: 35, items: [
                    { id: genId(), name: "Kit premiers soins", cost: 8, comment: "", priority: "P1" },
                    { id: genId(), name: "Doliprane / ibuprofène", cost: 5, comment: "", priority: "P1" },
                    { id: genId(), name: "Thermomètre", cost: 4, comment: "", priority: "P1" },
                    { id: genId(), name: "Crème mains, baume lèvres", cost: 6, comment: "Lyon = froid et sec", priority: "P1" },
                    { id: genId(), name: "Mouchoirs (×lot)", cost: 3, comment: "", priority: "P1" }
                ]},
                { name: "🧹 Entretien & ménage", budget: 30, items: [
                    { id: genId(), name: "Kit ménage (éponge, liquide)", cost: 6, comment: "", priority: "P1" },
                    { id: genId(), name: "Sacs poubelle", cost: 2, comment: "", priority: "P1" },
                    { id: genId(), name: "Lessive dosettes", cost: 5, comment: "", priority: "P1" },
                    { id: genId(), name: "Petite pelle & balayette", cost: 5, comment: "", priority: "P1" }
                ]},
                { name: "🔐 Divers indispensables", budget: 40, items: [
                    { id: genId(), name: "Cadenas casier", cost: 6, comment: "", priority: "P1" },
                    { id: genId(), name: "Kit couture voyage", cost: 3, comment: "", priority: "P2" },
                    { id: genId(), name: "Lampe de poche", cost: 5, comment: "", priority: "P2" },
                    { id: genId(), name: "Batterie externe", cost: 15, comment: "", priority: "P1" },
                    { id: genId(), name: "Enceinte Bluetooth", cost: 20, comment: "Optionnel", priority: "P2" }
                ]}
            ];
            await apiFetch('/seed', { method: 'POST', body: JSON.stringify({ categories: initialData }) });
        }

        function genId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function toggleCategory(catId) {
            expandedCategories[catId] = !expandedCategories[catId];
            render();
        }

        async function toggleItem(itemId, catId) {
            const item = appData[catId].items.find(i => i.id === itemId);
            if (!item) return;
            const newCompleted = !item.completed;
            try {
                await apiFetch('/items/' + itemId, {
                    method: 'PUT',
                    body: JSON.stringify({ completed: newCompleted })
                });
                item.completed = newCompleted;
                render();
            } catch (err) {
                console.error('Toggle error:', err);
                alert('Erreur: ' + err.message);
            }
        }

        async function deleteItem(itemId, catId) {
            if (!confirm("Supprimer cet article ?")) return;
            try {
                await apiFetch('/items/' + itemId, { method: 'DELETE' });
                appData[catId].items = appData[catId].items.filter(i => i.id !== itemId);
                render();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Erreur: ' + err.message);
            }
        }

        function editItem(itemId, catId) {
            editingItemId = itemId;
            editingCategoryId = catId;
            const item = appData[catId].items.find(i => i.id === itemId);
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemCategory').value = catId;
            document.getElementById('editItemCost').value = item.cost;
            document.getElementById('editItemPriority').value = item.priority || 'P1';
            document.getElementById('editItemComment').value = item.comment || '';
            openModal('editModal');
        }

        async function saveEditItem() {
            const item = appData[editingCategoryId].items.find(i => i.id === editingItemId);
            const newName = document.getElementById('editItemName').value.trim();
            const newCatId = document.getElementById('editItemCategory').value;
            const newCost = parseFloat(document.getElementById('editItemCost').value) || 0;
            const newPriority = document.getElementById('editItemPriority').value;
            const newComment = document.getElementById('editItemComment').value.trim();

            if (!newName) { alert("Le nom de l'article ne peut pas être vide"); return; }

            try {
                await apiFetch('/items/' + editingItemId, {
                    method: 'PUT',
                    body: JSON.stringify({ name: newName, cost: newCost, comment: newComment, priority: newPriority, category_id: parseInt(newCatId) })
                });
                if (newCatId !== editingCategoryId) {
                    const movedItem = appData[editingCategoryId].items.find(i => i.id === editingItemId);
                    appData[editingCategoryId].items = appData[editingCategoryId].items.filter(i => i.id !== editingItemId);
                    if (!appData[newCatId]) {
                        const cats = await apiFetch('/categories');
                        buildAppData(cats);
                    } else {
                        movedItem.name = newName;
                        movedItem.cost = newCost;
                        movedItem.comment = newComment;
                        movedItem.priority = newPriority;
                        appData[newCatId].items.push(movedItem);
                    }
                } else {
                    item.name = newName;
                    item.cost = newCost;
                    item.comment = newComment;
                    item.priority = newPriority;
                }
                closeModal('editModal');
                render();
            } catch (err) {
                console.error('Edit error:', err);
                alert('Erreur: ' + err.message);
            }
        }

        function updateCategorySelect() {
            const options = Object.entries(appData).map(([id, cat]) =>
                `<option value="${id}">${cat.name}</option>`
            ).join('');
            document.getElementById('newItemCategory').innerHTML =
                '<option value="">— Catégorie —</option>' + options;
            document.getElementById('editItemCategory').innerHTML = options;
        }

        async function addNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const catId = document.getElementById('newItemCategory').value;
            const newCatName = document.getElementById('newItemNewCategory').value.trim();
            const cost = parseFloat(document.getElementById('newItemCost').value) || 0;
            const priority = document.getElementById('newItemPriority').value;
            const comment = document.getElementById('newItemComment').value.trim();

            if (!name) { alert("Nom de l'article requis"); return; }

            let targetCatId = catId;

            try {
                if (newCatName && !catId) {
                    const newCat = await apiFetch('/categories', {
                        method: 'POST',
                        body: JSON.stringify({ name: newCatName, budget: 50 })
                    });
                    targetCatId = newCat.id;
                    appData[targetCatId] = { name: newCat.name, budget: newCat.budget, items: [] };
                    expandedCategories[targetCatId] = true;
                }

                if (!targetCatId) { alert('Sélectionnez ou créez une catégorie'); return; }

                const itemId = genId();
                await apiFetch('/items', {
                    method: 'POST',
                    body: JSON.stringify({ id: itemId, category_id: parseInt(targetCatId), name, cost, comment, priority })
                });

                appData[targetCatId].items.push({ id: itemId, name, cost, comment, completed: false, priority });

                document.getElementById('newItemName').value = '';
                document.getElementById('newItemCategory').value = '';
                document.getElementById('newItemNewCategory').value = '';
                document.getElementById('newItemCost').value = '';
                document.getElementById('newItemComment').value = '';

                closeModal('addModal');
                updateCategorySelect();
                buildCategoryFilters();
                render();
            } catch (err) {
                console.error('Add error:', err);
                alert('Erreur: ' + err.message);
            }
        }

        function itemMatchesFilter(item, catId) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'P1' || currentFilter === 'P2') {
                return item.priority === currentFilter;
            }
            if (currentFilter.startsWith('cat-')) {
                return currentFilter === 'cat-' + catId;
            }
            return true;
        }

        function categoryHasVisibleItems(catId) {
            if (currentFilter === 'all') return true;
            const cat = appData[catId];
            if (!cat) return false;
            if (currentFilter === 'P1' || currentFilter === 'P2') {
                return cat.items.some(i => i.priority === currentFilter);
            }
            if (currentFilter.startsWith('cat-')) {
                return currentFilter === 'cat-' + catId;
            }
            return true;
        }

        function render() {
            const container = document.getElementById('categoriesContainer');
            let html = '';

            Object.entries(appData).forEach(([catId, catData]) => {
                if (!categoryHasVisibleItems(catId)) {
                    html += `<div class="category-section hidden"></div>`;
                    return;
                }

                const allItems = catData.items;
                const visibleItems = allItems.filter(i => itemMatchesFilter(i, catId));
                const completed = visibleItems.filter(i => i.completed).length;
                const total = visibleItems.length;
                const spent = visibleItems.filter(i => i.completed).reduce((s, i) => s + i.cost, 0);
                const itemsCost = visibleItems.reduce((s, i) => s + i.cost, 0);
                const budget = catData.budget;
                const isExpanded = expandedCategories[catId];
                const percent = total ? Math.round((completed / total) * 100) : 0;
                const budgetPercent = Math.min(100, Math.round((spent / budget) * 100));

                html += `
                    <div class="category-section ${isExpanded ? '' : 'collapsed'}">
                        <div class="category-header" onclick="toggleCategory('${catId}')">
                            <div class="category-toggle">▼</div>
                            <div class="category-title">${catData.name}</div>
                            <div class="category-stats-header">
                                <span class="stat-chip">${completed}/${total}</span>
                                <span class="stat-chip success">${itemsCost.toFixed(0)}€</span>
                            </div>
                        </div>
                        <div class="progress-section">
                            <div class="progress-label">
                                <span>Progression</span><span>${percent}%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>
                            <div class="progress-label" style="margin-top: 0.6rem;">
                                <span>Budget</span><span>${spent.toFixed(0)}€ / ${budget}€</span>
                            </div>
                            <div class="budget-bar-container">
                                <div class="budget-spent" style="width: ${budgetPercent}%"></div>
                            </div>
                            <div class="budget-label">
                                <span>${(budget - spent).toFixed(0)}€ restant</span>
                                <span style="color: ${budgetPercent > 100 ? 'var(--ballet-danger)' : 'var(--ballet-taupe)'}">${budgetPercent}%</span>
                            </div>
                        </div>
                        <div class="items-container">
                            <div class="items-content">
                                ${visibleItems.length === 0 ? `
                                    <div class="empty-state">
                                        <div class="empty-icon">—</div>
                                        <div>Aucun article</div>
                                    </div>
                                ` : allItems.map(item => `
                                    <div class="item-wrapper" style="${!itemMatchesFilter(item, catId) ? 'display:none' : ''}">
                                        <div class="item ${item.completed ? 'completed' : ''}">
                                            <input type="checkbox" class="item-checkbox"
                                                   ${item.completed ? 'checked' : ''}
                                                   onchange="toggleItem('${item.id}', '${catId}')">
                                            <div class="item-info">
                                                <span class="item-name ${item.completed ? 'completed' : ''}">${item.name}</span>
                                                <span class="item-priority ${item.priority.toLowerCase()}">${item.priority}</span>
                                                <span class="item-cost">${item.cost.toFixed(2)}€</span>
                                            </div>
                                            <div class="item-actions">
                                                <button class="item-btn item-btn-edit" onclick="editItem('${item.id}', '${catId}')" title="Modifier">✎</button>
                                                <button class="item-btn item-btn-delete" onclick="deleteItem('${item.id}', '${catId}')" title="Supprimer">✕</button>
                                            </div>
                                        </div>
                                        ${item.comment ? `<div class="item-comment">${item.comment}</div>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateDashboard();
        }

        function updateDashboard() {
            let totalTodo = 0, totalDone = 0, totalSpent = 0, totalBudget = 0;
            Object.values(appData).forEach(cat => {
                totalBudget += cat.budget;
                cat.items.forEach(item => {
                    if (currentFilter !== 'all' && currentFilter !== 'P1' && currentFilter !== 'P2') {
                        if (!itemMatchesFilter(item, null)) return;
                    }
                    if (currentFilter === 'P1' || currentFilter === 'P2') {
                        if (item.priority !== currentFilter) return;
                    }
                    totalTodo++;
                    if (item.completed) { totalDone++; totalSpent += item.cost; }
                });
            });
            document.getElementById('countTodo').textContent = totalTodo - totalDone;
            document.getElementById('countDone').textContent = totalDone;
            document.getElementById('totalSpent').textContent = totalSpent.toFixed(0) + ' €';
            document.getElementById('totalBudget').textContent = totalBudget + ' €';

            const globalPct = totalTodo ? Math.round((totalDone / totalTodo) * 100) : 0;
            document.getElementById('globalPct').textContent = globalPct + '%';
            document.getElementById('globalFill').style.width = globalPct + '%';
            document.getElementById('globalItems').textContent = totalDone + '/' + totalTodo + ' articles';
            document.getElementById('globalBudget').textContent = totalSpent.toFixed(0) + '€ / ' + totalBudget + '€';
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
