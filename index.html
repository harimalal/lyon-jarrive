<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏃 Lyon J'arrive</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #5B8DD9; --secondary: #F4A0D8; --accent: #FFB366;
            --bg-light: #FFFFFF; --bg-card: #FFFFFF; --border: #F0E6E1;
            --text-main: #2e241f; --text-muted: #8b6f62;
            --danger: #c62828; --success: #2e7d32; --warning: #f57f17;
        }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFFFFF; color: var(--text-main); line-height: 1.5;
            display: flex; flex-direction: column;
        }
        .container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1rem; padding-bottom: 2rem; }
        header {
            background: linear-gradient(135deg, #5B8DD9 0%, #6B9FE8 100%);
            color: white; padding: 1.5rem 1rem; text-align: center; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(91, 141, 217, 0.15);
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; letter-spacing: -0.5px; }
        .header-meta { font-size: 0.85rem; opacity: 0.9; font-weight: 500; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
        .stat-box {
            background: var(--bg-card); padding: 1rem; border-radius: 1rem;
            box-shadow: 0 2px 12px rgba(91, 141, 217, 0.08); border-top: 4px solid #F4A0D8;
            position: relative; overflow: hidden;
        }
        .stat-box::before {
            content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(244, 160, 216, 0.08) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 0.4rem; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #5B8DD9; }
        .categories-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .category-section {
            background: var(--bg-card); border-radius: 1rem; overflow: hidden;
            box-shadow: 0 2px 12px rgba(91, 141, 217, 0.06); transition: all 0.3s ease;
            border: 1px solid #F5E6E1;
        }
        .category-header {
            padding: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 1rem;
            background: #FAFAFA; border-bottom: 2px solid #F5E6E1; transition: all 0.2s; user-select: none;
        }
        .category-header:active { background: #F5F5F5; }
        .category-toggle {
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #5B8DD9 0%, #6B9FE8 100%); color: white;
            border-radius: 50%; font-size: 1.2rem; flex-shrink: 0; transition: transform 0.3s ease;
        }
        .category-section.collapsed .category-toggle { transform: rotate(-90deg); }
        .category-title { flex: 1; font-weight: 600; font-size: 1rem; color: #5B8DD9; }
        .category-stats-header { display: flex; gap: 1rem; align-items: center; font-size: 0.85rem; }
        .stat-chip { background: rgba(91, 141, 217, 0.08); padding: 0.3rem 0.7rem; border-radius: 1rem; font-weight: 600; color: #5B8DD9; white-space: nowrap; }
        .stat-chip.budget { background: rgba(255, 179, 102, 0.08); color: #FF9933; }
        .stat-chip.success { background: rgba(244, 160, 216, 0.08); color: #F4A0D8; }
        .progress-section { padding: 0 1.2rem 1rem; display: none; }
        .category-section:not(.collapsed) .progress-section { display: block; }
        .progress-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 0.4rem; display: flex; justify-content: space-between; }
        .progress-bar-container { width: 100%; height: 8px; background: #E8E8E8; border-radius: 4px; overflow: hidden; margin-bottom: 0.8rem; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #F4A0D8 0%, #FFB366 100%); border-radius: 4px; transition: width 0.4s ease; }
        .budget-bar-container { width: 100%; height: 6px; background: #E8E8E8; border-radius: 3px; overflow: hidden; position: relative; }
        .budget-spent { height: 100%; background: linear-gradient(90deg, #5B8DD9 0%, #6B9FE8 100%); border-radius: 3px; transition: width 0.4s ease; }
        .budget-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; display: flex; justify-content: space-between; }
        .items-container { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; border-top: 1px solid #F5E6E1; }
        .category-section:not(.collapsed) .items-container { max-height: 3000px; }
        .items-content { padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
        .item {
            display: flex; gap: 0.8rem; align-items: flex-start; padding: 1rem;
            background: #FAFAFA; border-radius: 0.6rem; border-left: 3px solid #5B8DD9; transition: all 0.2s;
        }
        .item.completed { opacity: 0.6; background: #F5F5F5; border-left-color: #F4A0D8; }
        .item-checkbox { width: 24px; height: 24px; flex-shrink: 0; cursor: pointer; accent-color: #F4A0D8; margin-top: 2px; }
        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 500; font-size: 0.95rem; margin-bottom: 0.2rem; word-break: break-word; }
        .item-name.completed { text-decoration: line-through; color: var(--text-muted); }
        .item-meta { display: flex; gap: 0.4rem; flex-wrap: wrap; font-size: 0.75rem; margin-bottom: 0.5rem; }
        .item-tag { background: rgba(91, 141, 217, 0.1); padding: 0.2rem 0.5rem; border-radius: 0.3rem; color: #5B8DD9; font-weight: 500; }
        .item-comment { font-size: 0.8rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.6rem; padding: 0.6rem; background: rgba(244, 160, 216, 0.05); border-left: 2px solid #F4A0D8; border-radius: 0.3rem; word-break: break-word; }
        .item-actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
        .item-btn { padding: 0.4rem 0.6rem; border: none; background: none; cursor: pointer; font-size: 1rem; transition: all 0.2s; border-radius: 0.3rem; }
        .item-btn-edit { color: #5B8DD9; }
        .item-btn-delete { color: #F4A0D8; }
        .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.9rem; }
        .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .fab {
            position: fixed; bottom: 2rem; right: 1.5rem; width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #F4A0D8 0%, #FFB366 100%); color: white; border: none;
            font-size: 1.8rem; cursor: pointer; box-shadow: 0 4px 16px rgba(244, 160, 216, 0.4);
            display: flex; align-items: center; justify-content: center; transition: all 0.2s; z-index: 50;
        }
        .fab:active { transform: scale(0.9); box-shadow: 0 2px 8px rgba(244, 160, 216, 0.3); }
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 1000; padding: 1rem; overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .modal.active { display: flex; align-items: flex-end; }
        .modal-content {
            background: var(--bg-card); border-radius: 1.2rem 1.2rem 0 0; padding: 1.5rem;
            width: 100%; animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; justify-content: space-between; }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.4rem; }
        input, select, textarea {
            width: 100%; padding: 0.7rem; border: 1px solid #E0D6CF; border-radius: 0.6rem;
            font-size: 0.95rem; font-family: inherit; background: #FAFAFA; color: var(--text-main);
        }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #5B8DD9; background: white; box-shadow: 0 0 0 3px rgba(91, 141, 217, 0.1); }
        .btn {
            padding: 0.9rem; border: none; border-radius: 0.6rem; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; width: 100%;
            background: linear-gradient(135deg, #5B8DD9 0%, #6B9FE8 100%); color: white;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #F4F4F4; color: #5B8DD9; border: 1px solid #E0D6CF; margin-top: 0.5rem; }
        .button-group { display: flex; gap: 0.8rem; }
        .button-group .btn { flex: 1; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.8);
            z-index: 2000; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #5B8DD9;
        }
        .loading-overlay.hidden { display: none; }
        @media (max-width: 480px) {
            .container { padding: 0.8rem; padding-bottom: 2rem; }
            header { padding: 1rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏃 Lyon J'arrive</h1>
        <div class="header-meta">Gestion complète de l'emménagement • Internat Lyon</div>
    </header>

    <div class="container">
        <div class="dashboard">
            <div class="stat-box">
                <div class="stat-label">Articles À acheter</div>
                <div class="stat-value" id="countTodo">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Articles Achetés</div>
                <div class="stat-value" id="countDone">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Dépensé</div>
                <div class="stat-value" id="totalSpent">0 €</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Budget Total</div>
                <div class="stat-value" id="totalBudget">0 €</div>
            </div>
        </div>
        <div class="categories-list" id="categoriesContainer"></div>
    </div>

    <button class="fab" onclick="openModal('addModal')">➕</button>

    <!-- ADD MODAL -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Ajouter un article</span>
                <button class="close-btn" onclick="closeModal('addModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Article *</label>
                <input type="text" id="newItemName" placeholder="Ex: Oreiller">
            </div>
            <div class="form-group">
                <label>Catégorie *</label>
                <select id="newItemCategory"></select>
            </div>
            <div class="form-group">
                <label>Ou créer une nouvelle</label>
                <input type="text" id="newItemNewCategory" placeholder="Ex: 🎓 Études">
            </div>
            <div class="form-group">
                <label>Coût estimé (€)</label>
                <input type="number" id="newItemCost" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Commentaire</label>
                <textarea id="newItemComment" placeholder="Ex: Vérifier taille, promo Gifi..."></textarea>
            </div>
            <div class="button-group">
                <button class="btn" onclick="addNewItem()">Ajouter</button>
                <button class="btn btn-secondary" onclick="closeModal('addModal')">Annuler</button>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>Modifier l'article</span>
                <button class="close-btn" onclick="closeModal('editModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Article *</label>
                <input type="text" id="editItemName" placeholder="Ex: Oreiller">
            </div>
            <div class="form-group">
                <label>Catégorie</label>
                <select id="editItemCategory"></select>
            </div>
            <div class="form-group">
                <label>Coût (€)</label>
                <input type="number" id="editItemCost" step="0.01" min="0" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Commentaire</label>
                <textarea id="editItemComment" placeholder="Ex: Vérifier taille, promo Gifi..."></textarea>
            </div>
            <div class="button-group">
                <button class="btn" onclick="saveEditItem()">Enregistrer</button>
                <button class="btn btn-secondary" onclick="closeModal('editModal')">Annuler</button>
            </div>
        </div>
    </div>

    <div class="loading-overlay hidden" id="loadingOverlay">Chargement...</div>

    <script>
        const API = '/api';
        let appData = {};
        let expandedCategories = {};
        let editingItemId = null;
        let editingCategoryId = null;

        function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

        async function apiFetch(path, options = {}) {
            const res = await fetch(API + path, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: res.statusText }));
                throw new Error(err.error || 'API error');
            }
            return res.json();
        }

        async function initApp() {
            showLoading();
            try {
                const categories = await apiFetch('/categories');
                if (categories.length === 0) {
                    // First time — seed with initial data
                    await seedInitialData();
                    const fresh = await apiFetch('/categories');
                    buildAppData(fresh);
                } else {
                    buildAppData(categories);
                }
            } catch (err) {
                console.error('Init error:', err);
                alert('Erreur de connexion à la base de données. Veuillez réessayer.');
            }
            hideLoading();
            render();
        }

        function buildAppData(categories) {
            appData = {};
            categories.forEach(cat => {
                expandedCategories[cat.id] = true;
                appData[cat.id] = {
                    name: cat.name,
                    budget: cat.budget,
                    items: (cat.items || []).map(item => ({
                        id: item.id,
                        name: item.name,
                        cost: item.cost,
                        comment: item.comment || '',
                        completed: item.completed === 1
                    }))
                };
            });
            updateCategorySelect();
        }

        async function seedInitialData() {
            const initialData = [
                { name: "🛏️ Literie", budget: 120, items: [
                    { id: genId(), name: "Oreiller (60×60)", cost: 8, comment: "" },
                    { id: genId(), name: "Taies d'oreiller (×2)", cost: 5, comment: "" },
                    { id: genId(), name: "Couette 140×200 ou 200×200", cost: 25, comment: "Vérifier taille du lit" },
                    { id: genId(), name: "Housse de couette", cost: 12, comment: "" },
                    { id: genId(), name: "Drap-housse", cost: 7, comment: "" },
                    { id: genId(), name: "Protège-matelas", cost: 9, comment: "" },
                    { id: genId(), name: "Plaid / jeté de lit", cost: 10, comment: "" },
                    { id: genId(), name: "Coussins déco (×1)", cost: 6, comment: "" }
                ]},
                { name: "🚿 Toilette & hygiène", budget: 80, items: [
                    { id: genId(), name: "Serviettes de bain (×2)", cost: 16, comment: "" },
                    { id: genId(), name: "Petites serviettes (×2)", cost: 6, comment: "" },
                    { id: genId(), name: "Gant de toilette", cost: 2, comment: "" },
                    { id: genId(), name: "Peignoir / sortie de bain", cost: 18, comment: "Si salle de bains sur le palier" },
                    { id: genId(), name: "Trousse suspendue", cost: 7, comment: "" },
                    { id: genId(), name: "Miroir de table", cost: 4, comment: "" },
                    { id: genId(), name: "Panier transport", cost: 5, comment: "" },
                    { id: genId(), name: "Produits toilette", cost: 12, comment: "" }
                ]},
                { name: "🖥️ Bureau & fournitures", budget: 100, items: [
                    { id: genId(), name: "Lampe de bureau LED", cost: 15, comment: "" },
                    { id: genId(), name: "Multiprise USB", cost: 12, comment: "" },
                    { id: genId(), name: "Rallonge électrique", cost: 5, comment: "" },
                    { id: genId(), name: "Organiseur bureau", cost: 3, comment: "" },
                    { id: genId(), name: "Bloc-notes, stylos, post-it", cost: 7, comment: "" },
                    { id: genId(), name: "Agenda / planner", cost: 5, comment: "" },
                    { id: genId(), name: "Calculatrice", cost: 10, comment: "" },
                    { id: genId(), name: "Ciseaux, colle, scotch", cost: 4, comment: "" },
                    { id: genId(), name: "Casque / écouteurs", cost: 15, comment: "Pour respecter la colocation" },
                    { id: genId(), name: "Ventilateur USB", cost: 12, comment: "" }
                ]},
                { name: "📦 Rangement & organisation", budget: 65, items: [
                    { id: genId(), name: "Boîtes rangement (×3)", cost: 12, comment: "" },
                    { id: genId(), name: "Cintres (×10)", cost: 5, comment: "" },
                    { id: genId(), name: "Patère adhésive", cost: 3, comment: "Sans percer" },
                    { id: genId(), name: "Sac à linge sale", cost: 6, comment: "" },
                    { id: genId(), name: "Panier chargeurs", cost: 3, comment: "" }
                ]},
                { name: "🛋️ Confort & déco chambre", budget: 70, items: [
                    { id: genId(), name: "Tapis 60×90", cost: 12, comment: "" },
                    { id: genId(), name: "Rideau occultant", cost: 18, comment: "Si besoin, vérifier avec l'internat" },
                    { id: genId(), name: "Guirlande LED déco", cost: 6, comment: "" },
                    { id: genId(), name: "Photos / cadres / posters", cost: 8, comment: "" },
                    { id: genId(), name: "Pâte adhésive", cost: 2, comment: "Pas de clous autorisés" },
                    { id: genId(), name: "Mini plante", cost: 5, comment: "" }
                ]},
                { name: "☕ Alimentation & électroménager", budget: 65, items: [
                    { id: genId(), name: "Bouilloire électrique", cost: 18, comment: "Vérifier si autorisée" },
                    { id: genId(), name: "Tasse, verre, assiette, bol", cost: 8, comment: "" },
                    { id: genId(), name: "Couverts", cost: 3, comment: "" },
                    { id: genId(), name: "Boîte hermétique", cost: 4, comment: "" },
                    { id: genId(), name: "Gourde isotherme", cost: 12, comment: "" },
                    { id: genId(), name: "Thé, café, en-cas", cost: 8, comment: "" }
                ]},
                { name: "💊 Trousse de secours & pharmacie", budget: 35, items: [
                    { id: genId(), name: "Kit premiers soins", cost: 8, comment: "" },
                    { id: genId(), name: "Doliprane / ibuprofène", cost: 5, comment: "" },
                    { id: genId(), name: "Thermomètre", cost: 4, comment: "" },
                    { id: genId(), name: "Crème mains, baume lèvres", cost: 6, comment: "Lyon = froid et sec" },
                    { id: genId(), name: "Mouchoirs (×lot)", cost: 3, comment: "" }
                ]},
                { name: "🧹 Entretien & ménage", budget: 30, items: [
                    { id: genId(), name: "Kit ménage (éponge, liquide)", cost: 6, comment: "" },
                    { id: genId(), name: "Sacs poubelle", cost: 2, comment: "" },
                    { id: genId(), name: "Lessive dosettes", cost: 5, comment: "" },
                    { id: genId(), name: "Petite pelle & balayette", cost: 5, comment: "" }
                ]},
                { name: "🔐 Divers indispensables", budget: 40, items: [
                    { id: genId(), name: "Cadenas casier", cost: 6, comment: "" },
                    { id: genId(), name: "Kit couture voyage", cost: 3, comment: "" },
                    { id: genId(), name: "Lampe de poche", cost: 5, comment: "" },
                    { id: genId(), name: "Batterie externe", cost: 15, comment: "" },
                    { id: genId(), name: "Enceinte Bluetooth", cost: 20, comment: "Optionnel" }
                ]}
            ];
            await apiFetch('/seed', { method: 'POST', body: JSON.stringify({ categories: initialData }) });
        }

        function genId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function toggleCategory(catId) {
            expandedCategories[catId] = !expandedCategories[catId];
            render();
        }

        async function toggleItem(itemId, catId) {
            const item = appData[catId].items.find(i => i.id === itemId);
            if (!item) return;
            const newCompleted = !item.completed;
            try {
                await apiFetch('/items/' + itemId, {
                    method: 'PUT',
                    body: JSON.stringify({ completed: newCompleted })
                });
                item.completed = newCompleted;
                render();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        }

        async function deleteItem(itemId, catId) {
            if (!confirm("Supprimer cet article ?")) return;
            try {
                await apiFetch('/items/' + itemId, { method: 'DELETE' });
                appData[catId].items = appData[catId].items.filter(i => i.id !== itemId);
                render();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        }

        function editItem(itemId, catId) {
            editingItemId = itemId;
            editingCategoryId = catId;
            const item = appData[catId].items.find(i => i.id === itemId);
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemCategory').value = catId;
            document.getElementById('editItemCost').value = item.cost;
            document.getElementById('editItemComment').value = item.comment || '';
            openModal('editModal');
        }

        async function saveEditItem() {
            const item = appData[editingCategoryId].items.find(i => i.id === editingItemId);
            const newName = document.getElementById('editItemName').value.trim();
            const newCatId = document.getElementById('editItemCategory').value;
            const newCost = parseFloat(document.getElementById('editItemCost').value) || 0;
            const newComment = document.getElementById('editItemComment').value.trim();

            if (!newName) { alert("Le nom de l'article ne peut pas être vide"); return; }

            try {
                await apiFetch('/items/' + editingItemId, {
                    method: 'PUT',
                    body: JSON.stringify({ name: newName, cost: newCost, comment: newComment, category_id: parseInt(newCatId) })
                });
                // If category changed, move the item
                if (newCatId !== editingCategoryId) {
                    const movedItem = appData[editingCategoryId].items.find(i => i.id === editingItemId);
                    appData[editingCategoryId].items = appData[editingCategoryId].items.filter(i => i.id !== editingItemId);
                    if (!appData[newCatId]) {
                        // Need to fetch the new category
                        const cats = await apiFetch('/categories');
                        buildAppData(cats);
                    } else {
                        movedItem.name = newName;
                        movedItem.cost = newCost;
                        movedItem.comment = newComment;
                        appData[newCatId].items.push(movedItem);
                    }
                } else {
                    item.name = newName;
                    item.cost = newCost;
                    item.comment = newComment;
                }
                closeModal('editModal');
                render();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        }

        function updateCategorySelect() {
            const options = Object.entries(appData).map(([id, cat]) =>
                `<option value="${id}">${cat.name}</option>`
            ).join('');

            document.getElementById('newItemCategory').innerHTML =
                '<option value="">-- Sélectionner une catégorie --</option>' + options;
            document.getElementById('editItemCategory').innerHTML = options;
        }

        async function addNewItem() {
            const name = document.getElementById('newItemName').value.trim();
            const catId = document.getElementById('newItemCategory').value;
            const newCatName = document.getElementById('newItemNewCategory').value.trim();
            const cost = parseFloat(document.getElementById('newItemCost').value) || 0;
            const comment = document.getElementById('newItemComment').value.trim();

            if (!name) { alert('Veuillez entrer un nom d\'article'); return; }

            let targetCatId = catId;

            try {
                // Create new category if needed
                if (newCatName && !catId) {
                    const newCat = await apiFetch('/categories', {
                        method: 'POST',
                        body: JSON.stringify({ name: newCatName, budget: 50 })
                    });
                    targetCatId = newCat.id;
                    appData[targetCatId] = { name: newCat.name, budget: newCat.budget, items: [] };
                    expandedCategories[targetCatId] = true;
                }

                if (!targetCatId) { alert('Veuillez sélectionner ou créer une catégorie'); return; }

                const itemId = genId();
                await apiFetch('/items', {
                    method: 'POST',
                    body: JSON.stringify({ id: itemId, category_id: parseInt(targetCatId), name, cost, comment })
                });

                appData[targetCatId].items.push({ id: itemId, name, cost, comment, completed: false });

                document.getElementById('newItemName').value = '';
                document.getElementById('newItemCategory').value = '';
                document.getElementById('newItemNewCategory').value = '';
                document.getElementById('newItemCost').value = '';
                document.getElementById('newItemComment').value = '';

                closeModal('addModal');
                updateCategorySelect();
                render();
            } catch (err) {
                alert('Erreur: ' + err.message);
            }
        }

        function render() {
            const container = document.getElementById('categoriesContainer');
            let html = '';

            Object.entries(appData).forEach(([catId, catData]) => {
                const items = catData.items;
                const completed = items.filter(i => i.completed).length;
                const total = items.length;
                const spent = items.filter(i => i.completed).reduce((s, i) => s + i.cost, 0);
                const itemsCost = items.reduce((s, i) => s + i.cost, 0);
                const budget = catData.budget;
                const isExpanded = expandedCategories[catId];
                const percent = total ? Math.round((completed / total) * 100) : 0;
                const budgetPercent = Math.min(100, Math.round((spent / budget) * 100));

                html += `
                    <div class="category-section ${isExpanded ? '' : 'collapsed'}">
                        <div class="category-header" onclick="toggleCategory('${catId}')">
                            <div class="category-toggle">▼</div>
                            <div class="category-title">${catData.name}</div>
                            <div class="category-stats-header">
                                <span class="stat-chip">${completed}/${total}</span>
                                <span class="stat-chip success">${itemsCost.toFixed(2)}€</span>
                            </div>
                        </div>
                        <div class="progress-section">
                            <div class="progress-label">
                                <span>Progression articles</span><span>${percent}%</span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-fill" style="width: ${percent}%"></div>
                            </div>
                            <div class="progress-label" style="margin-top: 1rem;">
                                <span>Budget dépensé</span><span>${spent.toFixed(2)}€ / ${budget}€</span>
                            </div>
                            <div class="budget-bar-container">
                                <div class="budget-spent" style="width: ${budgetPercent}%"></div>
                            </div>
                            <div class="budget-label">
                                <span>${(budget - spent).toFixed(2)}€ restant</span>
                                <span style="color: ${budgetPercent > 100 ? 'var(--danger)' : '#5B8DD9'}">${budgetPercent}%</span>
                            </div>
                        </div>
                        <div class="items-container">
                            <div class="items-content">
                                ${items.length === 0 ? `
                                    <div class="empty-state">
                                        <div class="empty-icon">📭</div><div>Aucun article</div>
                                    </div>
                                ` : items.map(item => `
                                    <div class="item ${item.completed ? 'completed' : ''}">
                                        <input type="checkbox" class="item-checkbox"
                                               ${item.completed ? 'checked' : ''}
                                               onchange="toggleItem('${item.id}', '${catId}')">
                                        <div class="item-info" style="flex: 1;">
                                            <div class="item-name ${item.completed ? 'completed' : ''}">${item.name}</div>
                                            <div class="item-meta">
                                                <span class="item-tag">${item.cost.toFixed(2)}€</span>
                                            </div>
                                            ${item.comment ? `<div class="item-comment">💬 ${item.comment}</div>` : ''}
                                            <div class="item-actions">
                                                <button class="item-btn item-btn-edit" onclick="editItem('${item.id}', '${catId}')" title="Modifier">✏️</button>
                                                <button class="item-btn item-btn-delete" onclick="deleteItem('${item.id}', '${catId}')" title="Supprimer">🗑️</button>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            updateDashboard();
        }

        function updateDashboard() {
            let totalTodo = 0, totalDone = 0, totalSpent = 0, totalBudget = 0;
            Object.values(appData).forEach(cat => {
                totalBudget += cat.budget;
                cat.items.forEach(item => {
                    totalTodo++;
                    if (item.completed) { totalDone++; totalSpent += item.cost; }
                });
            });
            document.getElementById('countTodo').textContent = totalTodo - totalDone;
            document.getElementById('countDone').textContent = totalDone;
            document.getElementById('totalSpent').textContent = totalSpent.toFixed(2) + ' €';
            document.getElementById('totalBudget').textContent = totalBudget + ' €';
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
